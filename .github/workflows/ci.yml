name: CI DevSecOps Starter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile app/server.py
      - name: Smoke HTTP
        run: |
          python -B app/server.py > app.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/not-found)" = 404
      - name: Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config p/python --error app/
  dast-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start app
        run: |
          python3 -B app/server.py > app.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
      - name: OWASP ZAP baseline on local preview only
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:8080 -m 1 -I -r zap-preview.html -J zap-preview.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-preview-evidence
          path: |
            zap-preview.html
            zap-preview.json
          if-no-files-found: ignore
